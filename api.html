<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fetch API Data</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #e0f7fa;
            text-align: center;
            padding: 30px;
        }

        .container {
            background: white;
            max-width: 500px;
            margin: auto;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 10px #aaa;
        }

        h1 {
            color: rgb(121, 47, 110);
        }

        button {
            background-color: rgb(138, 66, 118);
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background-color: rgb(115, 49, 105);
        }

        #user {
            margin-top: 20px;
            overflow-wrap: anywhere;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>User Information</h1>

        <p>Click the button to get user data from an API.</p>

        <button onclick="getUser()">Load User</button>

        <div id="user"></div>
    </div>

  <script>
async function getUser() {
    const output = document.getElementById("user");

    output.textContent = "Loading data...";

    try {
        const response = await fetch(
            "https://jsonplaceholder.typicode.com/users/4"
        );

        if (!response.ok) {
            throw new Error("Could not fetch data");
        }

        const data = await response.json();

        output.innerHTML = `
            <h2>${data.name}</h2>
            <p><b>Email:</b> ${data.email}</p>
            <p><b>City:</b> ${data.address.city}</p>
            <p><b>Company:</b> ${data.company.name}</p>
        `;
    } catch (error) {
        output.textContent =
            "Data load nahi hua. Internet check karke dobara try karo.";
    }
}
</script>  
</body>
</html>
